name: 'Pedant Check'
description: 'Run pedant structure and style checks, reported as inline pull request annotations'

inputs:
  paths:
    description: >-
      Space-separated files or directories to check. Directories are searched
      recursively by pedant itself — do not pass a `**` glob, which needs bash 4's
      globstar and silently skips nested files where it is off. To exclude paths,
      add an `[overrides."glob"] enabled = false` block to .pedant.toml rather
      than narrowing this input: the project-level checks reason about the whole
      tree.
    default: 'src'
  config:
    description: 'Path to a .pedant.toml. Defaults to pedant''s own config discovery.'
    default: ''
  working-directory:
    description: >-
      Directory to run from. Must be the workspace root: the project-level checks
      (feature-boundary, conflicting-module-root, flat-module-family) resolve Cargo
      metadata and module layout relative to it.
    default: '.'
  format:
    description: 'Output format: github (inline annotations), text, or json.'
    default: 'github'

outputs:
  exit-code:
    description: 'pedant exit code: 0 clean, 1 deny-severity violations, 2 analysis error'
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    # Built from the pinned action source rather than fetched from the registry,
    # so the action and the binary it runs share one trust boundary. Duplicated
    # across pedant's actions because a composite action cannot `uses:` a sibling
    # local action when consumed from another repository.
    - name: Build pedant from action source
      shell: bash
      run: |
        PEDANT_ROOT="$(cd "${{ github.action_path }}/../../.." && pwd)"
        cargo build --manifest-path "$PEDANT_ROOT/pedant/Cargo.toml" --release --locked
        echo "PEDANT_BIN=$PEDANT_ROOT/target/release/pedant" >> "$GITHUB_ENV"

    - name: Run pedant check
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs travel through the environment, never interpolated into the script
      # body, so a crafted input cannot inject shell. Path discovery, de-duplication
      # and missing-path errors all belong to pedant — see pedant/src/input.rs.
      env:
        PEDANT_PATHS: ${{ inputs.paths }}
        PEDANT_CONFIG: ${{ inputs.config }}
        PEDANT_FORMAT: ${{ inputs.format }}
      run: |
        set -uo pipefail

        args=( check --format "$PEDANT_FORMAT" )
        if [ -n "$PEDANT_CONFIG" ]; then
          args+=( --config "$PEDANT_CONFIG" )
        fi

        # Unquoted on purpose: split the path list into separate arguments.
        # shellcheck disable=SC2086
        "$PEDANT_BIN" "${args[@]}" $PEDANT_PATHS
        status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit $status

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The eight first-party source trees, named once. `pedant-check` and
      # `pedant-gate` both scan exactly this set, and a crate added to one list
      # and forgotten in the other drops gate coverage — capability attestation
      # — with nothing turning red.
      FIRST_PARTY_SOURCES: pedant/src pedant-core/src pedant-graph/src pedant-lang/src pedant-mcp/src pedant-snippet/src pedant-syntax/src pedant-types/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The published-manifest check compares each current Cargo.toml with
          # its exact release tag. A shallow checkout would silently omit the
          # evidence that makes an already-published version immutable.
          fetch-depth: 0
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ripgrep
      # The cheapest gate in the job, and it needs no toolchain: shellcheck runs
      # in milliseconds against a checkout alone, so a broken script fails here
      # rather than after twenty minutes of cargo. The `check_*.sh` glob plus
      # the five named files are the committed shell this repository owns: the
      # boundary checks, the shared cargo-output classifier, the two plan-loop
      # verification runners that source it, and the resolution and graph proof
      # runners that source both it and `check_lib.sh`. Each sourcing script carries a
      # `# shellcheck source=` directive. A directive is an instruction to a
      # lint; running the lint is what makes it mean anything. `-x` is the flag
      # that follows those directives, so without it each would be linted
      # against an unresolved helper file and every function it defines would
      # read as an unknown command. The runner image ships shellcheck.
      - run: shellcheck -x docs/scripts/check_*.sh docs/scripts/cargo_infrastructure.sh docs/scripts/verify_step.sh docs/scripts/verify_affected.sh docs/scripts/run_resolution_proof.sh docs/scripts/run_graph_proof.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # Two of the three boundary checks need only cargo's resolver — about a
      # second between them, no compile — so they run ahead of everything that
      # builds. A forbidden crate edge or a dropped feature forwarding fails in
      # seconds instead of behind the whole build.
      # `check_syntax_capabilities.sh` stays below, because it builds and runs
      # `pedant` itself: its claim is about what pedant's own detection reports.
      - run: docs/scripts/check_syntax_dependency_closure.sh
      - run: docs/scripts/check_lang_feature_forwarding.sh
      - run: docs/scripts/check_published_manifests.sh
      # shellcheck above lints four scripts CI never ran, and a lint cannot see
      # a vacuous proof. This mode is the cheapest of the runner's seven —
      # `cargo tree` resolves and prints, it compiles nothing — and running it
      # executes the parts every other mode shares: the runner's own dispatch
      # and directory anchoring, both `source` lines, `require_tools`, and the
      # whole `cargo_infrastructure.sh` contract that `verify_step.sh` and
      # `verify_affected.sh` also depend on. What stays lint-only is the two
      # plan-loop runners and the registration/guarded-set modes, which need a
      # substrate build the plan loop already pays for locally. `PROOF_OUTPUT_DIR`
      # must name an existing directory; `runner.temp` is one.
      - run: docs/scripts/run_resolution_proof.sh resolution-tier1-dependency-closure
        env:
          PROOF_OUTPUT_DIR: ${{ runner.temp }}
      # The graph's own closure, and the other `cargo tree` mode that compiles
      # nothing. It captures the library's `normal,build,features` edges apart
      # from the harness's `normal,build,dev,features` edges, because dev-only
      # feature unification would otherwise let `resolution-test-support` read
      # as the published library's shape.
      - run: docs/scripts/run_graph_proof.sh graph-dependency-closure
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path test-support/process-guard/Cargo.toml --check
      - run: cargo clippy -- -D warnings
      - run: cargo clippy --locked --manifest-path test-support/process-guard/Cargo.toml --all-targets -- -D warnings
      # `--all-targets` is what puts the `tests/` trees of pedant, pedant-core,
      # pedant-types, and pedant-mcp under clippy at all: without it no job in
      # this file lints them, and `cargo test` below compiles them under rustc
      # alone. It rides on the semantic invocation rather than the default one
      # because every `#[cfg(feature = ...)]` in those test roots gates
      # positively on `semantic`, so this configuration compiles a superset of
      # what the default one would.
      - run: cargo clippy --workspace --features semantic --all-targets -- -D warnings
      # The two proof-only feature families are default-off, so the broad
      # semantic clippy invocation above cannot compile their gated adapters.
      # Keep them explicit: ordinary production builds still select neither.
      - run: cargo clippy -p pedant-core --no-default-features --features resolution-test-support --all-targets -- -D warnings
      - run: cargo clippy -p pedant --features resolution-test-support --all-targets -- -D warnings
      - run: cargo clippy -p pedant-mcp --features completion-proof-support --all-targets -- -D warnings
      # Dogfooded with a blocking source-size ceiling. The project config's
      # 500-line warning tier is advisory for consumers, but this repository's
      # acceptance contract must not print those warnings and call itself clean.
      # The explicit CLI ceiling is stable across local and GitHub verification.
      # `paths` names directories — pedant recurses them itself. The globs this
      # replaced ran through bash without globstar, so `**` degraded to `*`: they
      # reached 42 of 53 sources and never once covered pedant-core/src/ir/semantic/.
      - run: cargo run --locked -p pedant -- check --format github --max-source-file-lines 500 $FIRST_PARTY_SOURCES
      # pedant-snippet and pedant-syntax are the two crates whose test helpers
      # are held to the same structural limits as production source. The other
      # five carry `tests/` directories that no step here checks. Test sources
      # stay out of the capability attestation surface either way.
      - uses: ./.github/actions/pedant-check
        with:
          paths: pedant-snippet/tests pedant-syntax/tests
      # The roots and `#[path]` support trees this resolution work owns. Each
      # root is named on its own and each support tree whole, rather than the
      # five crates' `tests/` directories, because the rest of those directories
      # is older harnesses this list does not claim to have brought up to the
      # structural bar. A support tree is never named child by child: the child
      # it omitted would be the one nothing checks.
      - uses: ./.github/actions/pedant-check
        with:
          paths: pedant-types/tests/serialization.rs pedant-types/tests/serialization_support pedant-syntax/tests/enclosing_unit.rs pedant-lang/tests/detection.rs pedant-lang/tests/capability.rs pedant-lang/tests/capability_support pedant-snippet/tests/interfaces.rs pedant-core/tests/substrate.rs pedant-core/tests/substrate_support pedant-graph/tests/graph.rs pedant-graph/tests/graph_support pedant-core/tests/semantic.rs pedant-core/tests/semantic_support pedant/tests/supply_chain.rs pedant/tests/supply_chain_support pedant-mcp/tests/index.rs pedant-mcp/tests/index_support pedant-mcp/tests/watcher.rs pedant-mcp/tests/watcher_support pedant-mcp/tests/tools.rs pedant-mcp/tests/tools_support pedant-mcp/tests/integration.rs pedant-mcp/tests/integration_support pedant-mcp/tests/fixture_support test-support/process-guard/src
      - uses: ./.github/actions/pedant-gate
        with:
          paths: ${{ env.FIRST_PARTY_SOURCES }}
      - run: cargo test
      # A single workspace command exhausts the per-command acceptance budget:
      # pedant's semantic process tests consume most of it before pedant-core
      # starts. The split preserves the same package/feature coverage while
      # giving each authoritative command its own budget.
      - run: cargo test -p pedant --features semantic
      - run: cargo test --workspace --exclude pedant --features semantic
      - run: cargo test -p pedant --features resolution-test-support --test supply_chain snapshot_capability_projection_reuses_stored_file_ir -- --exact
      - run: cargo test -p pedant-mcp --features completion-proof-support --test integration relative_completion_paths_are_anchored_to_workspace_root -- --exact
      - run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps
      - run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps --features semantic
      # The substrate configurations. Clippy rather than `cargo check`, because
      # dead code is the failure mode the item-level `checks` gates guard and
      # `cargo check` does not fail on it; the workspace declares no
      # [workspace.lints], so `-D warnings` belongs on the invocation. Clippy
      # alone is not enough either: these invocations omit `--all-targets`, so
      # they never compile the test targets, hence the paired `cargo test`.
      - run: cargo clippy -p pedant-core --no-default-features -- -D warnings
      - run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps -p pedant-core --no-default-features
      - run: cargo clippy -p pedant-core --no-default-features --features semantic -- -D warnings
      - run: cargo test -p pedant-core --no-default-features
      - run: cargo test -p pedant-core --no-default-features --features semantic
      # The third boundary check, and the only one that needs a build: it runs
      # pedant's own capability detection over the two first-party trees, so a
      # new write, spawn, or network call there fails here rather than arriving
      # as a documented exception. Its two cargo-only siblings run near the top
      # of this job.
      - run: docs/scripts/check_syntax_capabilities.sh
      # The graph's one build-backed mode here: pedant's own detection over
      # `pedant-graph/src`, behind a sentinel mirror that proves the detectors
      # are live.
      #
      # `graph-owner-registration` is not run. It lists and then runs the
      # complete `pedant-core --features resolution-test-support` substrate
      # target, whose owners read `.manifest.toml`, `docs/design-rationale.md`,
      # and `docs/testing.md` — none of which this checkout carries — and their
      # reader panics rather than skip on an absent path. It is local acceptance
      # for the same reason `resolution-owner-registration` is. No graph
      # predicate goes unrun here: the bare `cargo test` step above builds and
      # runs the whole `pedant-graph` target.
      - run: docs/scripts/run_graph_proof.sh graph-source-capabilities
      - run: cargo clippy -p pedant-graph --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps -p pedant-graph
      - run: cargo clippy -p pedant-syntax -p pedant-snippet --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps -p pedant-syntax -p pedant-snippet --all-features
      # `pedant-syntax` gates parser dispatch on each backend feature, so every
      # configuration a consumer can enable is its own compile path and
      # `--all-features` proves nothing about the one that enables `rust` alone.

      # These carry `--all-targets` because the test root gates its modules on
      # the same features: without it no CI job ever compiles a single-feature
      # test configuration, and a module that vanishes under one feature reads
      # as a passing run.
      - run: cargo clippy -p pedant-syntax --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p pedant-syntax --no-default-features --features rust --all-targets -- -D warnings
      - run: cargo clippy -p pedant-syntax --no-default-features --features ts-python --all-targets -- -D warnings
      - run: cargo clippy -p pedant-syntax --no-default-features --features ts-javascript --all-targets -- -D warnings
      - run: cargo clippy -p pedant-syntax --no-default-features --features ts-typescript --all-targets -- -D warnings
      - run: cargo clippy -p pedant-syntax --no-default-features --features ts-go --all-targets -- -D warnings
      - run: cargo clippy -p pedant-syntax --no-default-features --features ts-bash --all-targets -- -D warnings
      # `pedant-lang` forwards each backend to `pedant-syntax`, so every
      # single-feature configuration is a separate compile path. These carry
      # `--all-targets` for the same reason the block above does:
      # `tests/capability.rs` gates twelve tests on individual `ts-*` features,
      # and without it no job ever compiled one of those configurations.
      - run: cargo clippy -p pedant-lang --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p pedant-lang --no-default-features --features ts-python --all-targets -- -D warnings
      - run: cargo clippy -p pedant-lang --no-default-features --features ts-javascript --all-targets -- -D warnings
      - run: cargo clippy -p pedant-lang --no-default-features --features ts-typescript --all-targets -- -D warnings
      - run: cargo clippy -p pedant-lang --no-default-features --features ts-go --all-targets -- -D warnings
      - run: cargo clippy -p pedant-lang --no-default-features --features ts-bash --all-targets -- -D warnings
      - run: cargo test -p pedant-lang --no-default-features
      # Clippy proving a mixed `ts-*` configuration compiles is not the same as
      # running it, and until this step no job ran one. Every `#[cfg(feature =
      # "ts-*")]` test in `tests/capability.rs` gates on a single positive
      # feature, so all twelve execute under the default-feature `cargo test`
      # above and none under one grammar alone. This run links JavaScript and
      # leaves TypeScript, Python, Go, and Bash out — the configuration where
      # `javascript.rs::ts_grammar_enabled` must answer false for a `.ts` file
      # while the tree-sitter path is live for a `.js` one.
      - run: cargo test -p pedant-lang --no-default-features --features ts-javascript
      # Deliberately unify the dependency's TypeScript grammar without enabling
      # pedant-lang's matching feature. The boundary test proves pedant-lang
      # still chooses its regex fallback for TypeScript in this graph.
      - run: cargo test -p pedant-lang --no-default-features --features ts-javascript,pedant-syntax/ts-typescript
      - run: cargo test -p pedant-syntax -p pedant-snippet --all-features
      # The parserless and Rust-only builds are the only ones that execute the
      # disabled-backend contract: everywhere else `extraction_enabled` is true
      # for every language and those assertions are skipped, so clippy proving
      # they compile is not the same as running them.
      - run: cargo test -p pedant-syntax --no-default-features
      - run: cargo test -p pedant-syntax --no-default-features --features rust
      # One grammar and five disabled ones. This is the only configuration that
      # compiles the shared tree-sitter support module and still answers false
      # for `extraction_enabled`, so it is the only one where the disabled-
      # grammar assertions in that module execute at all. Under `--all-features`
      # their loops run zero bodies, and under the two runs above the module
      # does not compile.
      - run: cargo test -p pedant-syntax --no-default-features --features ts-python
      - run: cargo install cargo-deny && cargo deny check

  windows-process-containment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # Compile the shared helper's Windows Job Object branch under its own
      # lockfile, then prove both consumer guards reap a real descendant on
      # success, timeout, and early-error paths.
      - run: cargo test --locked --manifest-path test-support/process-guard/Cargo.toml
      - run: cargo test --locked -p pedant --test supply_chain supply_chain_process_guard_reaps_descendants_on_success_timeout_and_early_error -- --exact
      - run: cargo test --locked -p pedant-mcp --test integration mcp_stdio_guard_reaps_descendants_on_success_timeout_and_early_error -- --exact

  macos-watcher:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # The macOS Kqueue selection is behavioral, not compile-only: every
      # create, degraded-write, and rename case must reach the shared index.
      - run: cargo test --locked -p pedant-mcp --test watcher -- --nocapture

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: ./.github/actions/supply-chain-check
        with:
          baseline-path: .pedant/baselines
          # Cargo.lock already checksums every registry dep, so hash-mismatch
          # duplicates it and new-capability admits a wholly-new crate. This tier
          # fails on a new dependency AND on capability escalation, but not on a
          # routine version bump — so a maintainer-takeover or an injected crate
          # trips CI until a human reviews it and runs `supply-chain update`.
          fail-on: new-dependency

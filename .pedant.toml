# pedant project config — CLI binary, so eprintln! is allowed

max_depth = 2

# Structural checks. Thresholds sit deliberately above pedant's shipped
# defaults for bodies and methods (120 / 40) and at the default for files, so
# this repo holds itself to a bar at least as strict as it recommends.
check_long_function_body = true
max_function_body_lines = 80
check_module_root_definitions = true
check_large_source_file = true
check_high_method_count = true
max_methods = 15
check_scattered_inherent_impl = true
check_conflicting_module_root = true
check_nested_if = true
check_if_in_match = true
check_nested_match = true
check_match_in_if = true
forbid_else = true
forbid_unsafe = true
check_dyn_return = true
check_dyn_param = true
check_vec_box_dyn = true
check_dyn_field = true
check_clone_in_loop = true
check_default_hasher = true
check_mixed_concerns = true
check_inline_tests = true
check_let_underscore_result = true

# stderr/stdout write failures are unrecoverable — discard is intentional
[overrides."pedant/src/main.rs"]
check_let_underscore_result = false

# Same pattern — stderr writes before process::exit are unrecoverable
[overrides."pedant-mcp/src/main.rs"]
check_let_underscore_result = false

# config.rs houses all config-related types — they share a concern but
# not a type-graph edge (Cli, ConfigFile, PatternCheck, etc.)
[overrides."pedant/src/config.rs"]
check_mixed_concerns = false

# checks.rs houses the check catalog: CheckInfo and the finding-detail types
# share that concern but not a type-graph edge (ViolationType is macro-generated
# and invisible to the syntactic extractor).
[overrides."pedant-core/src/checks.rs"]
check_mixed_concerns = false

[gate]
# A scanner necessarily contains the patterns it scans for: pedant's own
# detector embeds '-----BEGIN ' (capabilities.rs, string_analysis.rs) and
# 'https://', so its source always reports crypto string literals alongside
# network. The rule is permanently saturated here and can never carry signal
# for this repo. It stays live for consumers.
key-material-network = false

[check_naming]
enabled = true

[forbid_attributes]
enabled = true
patterns = [
    "allow(dead_code)",
    "allow(unused*)",
    "allow(clippy::*)",
]

[forbid_types]
enabled = true
patterns = [
    "Arc<String>",
    "Arc<Vec<*>>",
    "Box<dyn*Error*>",
]

[forbid_calls]
enabled = true
patterns = [
    ".unwrap()",
    ".expect(*)",
]

# No eprintln! — this is a CLI tool
[forbid_macros]
enabled = true
patterns = [
    "panic!",
    "todo!",
    "unimplemented!",
    "dbg!",
    "println!",
]

# Relax rules for test fixtures (deliberately bad code)
[overrides."tests/fixtures/**"]
enabled = false

[overrides."tests/**"]
max_depth = 5
forbid_unsafe = false

[overrides."tests/**".forbid_calls]
enabled = false

[overrides."tests/**".forbid_macros]
enabled = false

# Process-tree containment is shared test infrastructure moved outside a
# conventional `tests/` tree for reuse. This exact file is the required libc
# and Windows Job Object FFI boundary; every other Pedant rule stays active.
[overrides."test-support/process-guard/src/containment.rs"]
forbid_unsafe = false

[overrides."target/**"]
enabled = false

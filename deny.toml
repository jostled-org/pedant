[advisories]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Cargo omits versionless dev path dependencies from published manifests. The
# workspace-excluded process guard relies on that behavior so it never becomes
# a crates.io requirement; registry wildcard dependencies remain denied above.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

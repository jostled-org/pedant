[package]
name = "pedant-core"
version = "0.21.1"
edition = "2024"
rust-version = "1.96"
description = "Analysis engine for pedant: IR extraction, style checks, and capability detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/pedant"
readme = "../README.md"
keywords = ["linter", "lint", "static-analysis", "ai", "code-quality"]

[features]
default = ["checks"]
# The judgment surface: style checks, the gate engine, check config, violation
# output, and the orchestrating lint entry points. Disabling it leaves the
# substrate — fact extraction, capability detection, hashing, pattern matching,
# and the Cargo project model.
checks = ["dep:serde"]
# Proof-only observation of the production project and snapshot loaders. No
# default or non-dev edge selects it; ordinary builds compile no instrumentation.
resolution-test-support = []
semantic = [
    "ra_ap_ide",
    "ra_ap_hir",
    "ra_ap_syntax",
    "ra_ap_vfs",
    "ra_ap_project_model",
    "ra_ap_load-cargo",
    "line-index",
]

[dependencies]
syn = { version = "2", features = ["full", "visit", "parsing"] }
# The Cargo project model parses manifests directly and validates the versions
# it resolves, so both are substrate dependencies.
toml = "1"
semver = "1"
serde = { version = "1", features = ["derive"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
pedant-types = { version = "0.15.0", path = "../pedant-types" }
thiserror = "2"
sha2 = "0.11"
ra_ap_ide = { version = "0.0.342", optional = true }
ra_ap_hir = { version = "0.0.342", optional = true }
ra_ap_vfs = { version = "0.0.342", optional = true }
ra_ap_project_model = { version = "0.0.342", optional = true }
ra_ap_syntax = { version = "0.0.342", optional = true }
ra_ap_load-cargo = { version = "0.0.342", optional = true }
line-index = { version = "0.1.2", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# tests/substrate.rs parses Cargo.toml and lib.rs. `syn` is stated here so a
# later gate on it cannot silently break these tests; `toml` is a substrate
# dependency above and needs no dev copy.
syn = { version = "2", features = ["full", "visit", "parsing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

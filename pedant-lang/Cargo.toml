[package]
name = "pedant-lang"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
description = "Multi-language capability detection for pedant"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/pedant"

[features]
default = ["ts-python", "ts-javascript", "ts-typescript", "ts-go", "ts-bash"]
ts-python = ["pedant-syntax/ts-python"]
ts-javascript = ["pedant-syntax/ts-javascript"]
ts-typescript = ["pedant-syntax/ts-typescript"]
ts-go = ["pedant-syntax/ts-go"]
ts-bash = ["pedant-syntax/ts-bash"]

[dependencies]
pedant-syntax = { version = "0.1.0", path = "../pedant-syntax", default-features = false }
pedant-types = { version = "0.13.0", path = "../pedant-types" }

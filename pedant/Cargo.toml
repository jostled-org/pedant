[package]
name = "pedant"
version = "0.27.5"
edition = "2024"
rust-version = "1.96"
description = "An opinionated Rust linter, with special focus on AI-generated code"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/pedant"
readme = "../README.md"
keywords = [
  "lint",
  "linter",
  "static-analysis",
  "code-quality",
  "developer-tools",
]
categories = ["development-tools", "development-tools::cargo-plugins"]

[[bin]]
name = "pedant"
path = "src/main.rs"

[dependencies]
pedant-core = { version = "0.21.2", path = "../pedant-core", features = ["checks"] }
# The CLI is the composition owner: it supplies snapshots and resolution
# reports to the topology library, then judges the result through pedant-core.
# Neither library depends on the other in this direction.
pedant-graph = { version = "0.2.0", path = "../pedant-graph" }
pedant-lang = { version = "0.6.0", path = "../pedant-lang" }
pedant-types = { version = "0.15.0", path = "../pedant-types" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
thiserror = "2"

[features]
default = []
semantic = ["pedant-core/semantic"]
# Forwards the substrate's proof-only observation so the spawned binary can
# report what its production loaders did. No default or non-dev edge selects it.
resolution-test-support = ["pedant-core/resolution-test-support"]

[dev-dependencies]
pedant-process-guard = { path = "../test-support/process-guard" }
serde_json = "1"
# tests/supply_chain_support/probe_receipt.rs recomputes the digests a receipt
# reports.
sha2 = "0.11"

[package.metadata.docs.rs]
# pedant is a CLI binary — the library API lives in pedant-core.
# See https://docs.rs/pedant-core for API documentation.
targets = []

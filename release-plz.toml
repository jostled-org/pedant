[workspace]
# Release every package together after the generated release PR has supplied
# new versions. The workflow's readiness gate prevents publication from an
# implementation commit whose tagged dependencies still contain older source.
release_always = true

[[package]]
name = "pedant-types"

# Ahead of pedant-core: the Go resolution surface makes pedant-core an optional,
# versioned consumer of pedant-syntax, and cargo replaces that path edge with a
# registry edge while packaging.
[[package]]
name = "pedant-syntax"

[[package]]
name = "pedant-core"

[[package]]
name = "pedant-graph"

# After both graph producers: pedant-snippet takes pedant-core and pedant-graph
# as optional, versioned dependencies, and an optional path edge becomes a
# registry edge while packaging exactly as an unconditional one does. Released
# first, it would ask crates.io for versions that do not exist yet.
[[package]]
name = "pedant-snippet"

[[package]]
name = "pedant-lang"

[[package]]
name = "pedant-mcp"

[[package]]
name = "pedant"
changelog_path = "./CHANGELOG.md"

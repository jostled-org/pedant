name = "pedant-types"

[[package]]
name = "pedant-core"

[[package]]
name = "pedant-graph"

[[package]]
name = "pedant-syntax"

[[package]]
name = "pedant-snippet"

[[package]]
name = "pedant-lang"

[[package]]
name = "pedant-mcp"

[[package]]
name = "pedant"
